[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-gate"
version = "0.1.0"
description = "Stop an AI coding agent before it does something it cannot undo: a deterministic permission gate and tamper-evident audit log that runs as a PreToolUse hook."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "VECTOR MODS" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
vgate = "vector_gate.cli:main"

[tool.setuptools]
packages = ["vector_gate"]
